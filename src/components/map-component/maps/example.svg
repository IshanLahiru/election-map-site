<svg
    width="500"
    height="500"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 0 500 500"
>
    <!-- Rectangle -->
    <rect
        x="10"
        y="10"
        width="150"
        height="100"
        fill="red"
        stroke="black"
        stroke-width="3"
        opacity="0.8"
    />

    <!-- Circle -->
    <circle
        cx="250"
        cy="60"
        r="40"
        fill="green"
        stroke="blue"
        stroke-width="4"
        opacity="0.7"
    />

    <!-- Ellipse -->
    <ellipse
        cx="400"
        cy="60"
        rx="50"
        ry="25"
        fill="yellow"
        stroke="orange"
        stroke-width="2"
    />

    <!-- Line -->
    <line
        x1="10"
        y1="150"
        x2="490"
        y2="150"
        stroke="black"
        stroke-width="2"
        stroke-dasharray="5,5"
    />

    <!-- Polygon -->
    <polygon
        points="100,200 40,380 190,258 10,258 160,380"
        fill="purple"
        stroke="pink"
        stroke-width="3"
    />

    <!-- Polyline -->
    <polyline
        points="0,240 40,280 80,240 120,280 160,240"
        fill="none"
        stroke="cyan"
        stroke-width="4"
        stroke-dasharray="10,5"
    />

    <!-- Path -->
    <path
        d="M 10 300 Q 95 210 180 300 T 350 300"
        fill="none"
        stroke="red"
        stroke-width="3"
        stroke-linecap="round"
    />

    <!-- Text -->
    <text
        x="10"
        y="400"
        font-family="Verdana"
        font-size="35"
        fill="black"
        opacity="0.9"
    >
        SVG Example
    </text>

    <!-- Image -->
    <image
        xlink:href="https://via.placeholder.com/150"
        x="300"
        y="200"
        height="150"
        width="150"
        opacity="0.8"
    />
</svg>
